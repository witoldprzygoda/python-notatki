site_name: Python Notatki
site_description: Podręcznik języka Python 3.14 i jego zastosowań
site_author: Witold Przygoda

theme:
  name: material
  language: pl
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Przełącz na tryb ciemny
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Przełącz na tryb jasny
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    logo: material/language-python
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy
    - content.tabs.link
    - navigation.sections
    # ── WARIANTY UKŁADU (odkomentuj JEDNĄ linię i przeładuj) ──
    # - toc.integrate      # WARIANT B: prawy spis wjeżdża do lewego panelu
    # - navigation.tabs    # WARIANT C: rozdziały jako zakładki w górnym pasku

plugins:
  - search:
      lang: pl

hooks:
  - scripts/build_activities.py

watch:
  - activities

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  - pymdownx.smartsymbols

extra_css:
  - stylesheets/extra.css
  - stylesheets/interactive.css

extra_javascript:
  - path: javascripts/interactive/bootstrap.js
    type: module

extra:
  presentation_mode: interactive

nav:
  - Strona główna: index.md
  - Python Notatki:
      - 1. Instalacja i środowisko pracy:
          - Wprowadzenie: 01-instalacja/index.md
          - Instalacja Pythona: 01-instalacja/instalacja.md
          - Ścieżki i utrzymanie interpreterów: 01-instalacja/sciezki-i-utrzymanie.md
          - Pip — zarządzanie pakietami: 01-instalacja/pip.md
          - Wirtualne środowisko venv: 01-instalacja/venv.md
          - Konfigurowanie narzędzi: 01-instalacja/konfiguracja.md
          - Notebook: 01-instalacja/notebook.md
          - Google Colab: 01-instalacja/colab.md
          - Python w przeglądarce: 01-instalacja/przegladarka.md
          - Narzędzia AI: 01-instalacja/ai-tools.md
      - 2. Konsola:
