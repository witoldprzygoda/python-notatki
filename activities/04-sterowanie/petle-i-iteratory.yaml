schema_version: 2
page: 04-sterowanie/petle-i-iteratory.md
slot_id: petle-i-iteratory-activities

activities:
  - activity_id: flow-for-quiz-001
    version: 1
    section_id: petla-for
    type: single_choice
    label: "Sprawdzenie zrozumienia pętli for"
    prompt: "Ile razy wykona się ciało pętli for przechodzącej po łańcuchu „abc”?"
    options:
      - option_id: a
        label: "Dwa razy"
      - option_id: b
        label: "Trzy razy"
      - option_id: c
        label: "Cztery razy"
    correct_option_id: b
    feedback:
      correct: "Pętla wykona się raz dla każdego z trzech znaków."
      incorrect: "Łańcuch „abc” zawiera trzy znaki, a pętla wykona się raz dla każdego z nich."

  - activity_id: flow-for-code-001
    version: 1
    section_id: petla-for
    type: code
    label: "Ćwiczenie: iteracja po łańcuchu"
    prompt: "Uzupełnij ciało pętli tak, aby wypisać każdy znak w osobnym wierszu."
    starter_code: |
      for znak in "abc":
          # Wypisz bieżący znak.
          pass
    checker:
      type: stdout_lines_exact
      expected_lines:
        - "a"
        - "b"
        - "c"
    feedback:
      correct: "Program wypisał wszystkie znaki w oczekiwanej kolejności."
      incorrect: "Wynik powinien zawierać znaki a, b i c, każdy w osobnym wierszu."
