# Wydanie kursowe z ćwiczeniami (gałąź cwiczenia).
# Dziedziczy całą konfigurację książki z mkdocs.yml i dodaje tylko warstwę ćwiczeń.
# MkDocs scala słowniki, lecz listy z tego pliku zastępują listy książki.
# Dlatego extra_css i extra_javascript zaczynają się od pozycji książki,
# przepisanych dosłownie i w kolejności z mkdocs.yml, a pliki warstwy stoją
# po nich; bramka (etap G2) sprawdza, czy każda lista wspólna z książką
# zaczyna się dokładnie od listy książki.
INHERIT: mkdocs.yml

hooks:
  - scripts/build_activities.py

watch:
  - activities

extra_css:
  - stylesheets/extra.css
  - stylesheets/interactive.css

extra_javascript:
  - javascripts/naglowek.js
  - path: javascripts/interactive/bootstrap.js
    type: module

extra:
  presentation_mode: interactive
