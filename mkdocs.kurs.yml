# Wydanie kursowe z ćwiczeniami (gałąź cwiczenia).
# Dziedziczy całą konfigurację książki z mkdocs.yml i dodaje tylko warstwę ćwiczeń.
# MkDocs scala słowniki, lecz listy z tego pliku zastępują listy książki.
# Dlatego extra_css i extra_javascript zaczynają się od pozycji książki,
# przepisanych dosłownie i w kolejności z mkdocs.yml, a pliki warstwy stoją
# po nich; bramka (etap G2) sprawdza, czy każda lista wspólna z książką
# zaczyna się dokładnie od listy książki.
INHERIT: mkdocs.yml

hooks:
  - scripts/build_activities.py

# Podgląd (mkdocs serve) sam obserwuje docs i ten plik. Lista dodaje definicje
# aktywności i konfigurację książki (INHERIT), której MkDocs bez niej nie
# obserwuje: serwer pozostawiony podczas scalenia książki przebudowuje wtedy
# wydanie z jej nowym stanem. Szablony motywu z katalogu wskazanego
# w theme.custom_dir książki obserwuje podgląd uruchomiony z opcją
# --watch-theme (kurs/README.md); lista ich nie wymienia, ponieważ MkDocs
# odrzuca konfigurację, której ścieżka z listy nie istnieje, a katalog należy
# do książki.
watch:
  - activities
  - mkdocs.yml

extra_css:
  - stylesheets/extra.css
  - stylesheets/interactive.css

extra_javascript:
  - javascripts/naglowek.js
  - path: javascripts/interactive/bootstrap.js
    type: module

extra:
  presentation_mode: interactive
